name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp ./android/app/build/outputs/apk/debug/app-debug.apk ./release-output/CyberArena_ZeroHour_v1.0.0.apk
          echo "APK generated successfully:"
          ls -lh ./release-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberArena-ZeroHour-APK
          path: ./release-output/CyberArena_ZeroHour_v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Cyber Arena: Zero Hour v1.0.0 (Android APK)"
          body: |
            ## 🎮 Cyber Arena: Zero Hour - Android Release
            
            Download the Android APK below and install it directly on your mobile device!
            
            ### 📱 Installation Instructions:
            1. Download `CyberArena_ZeroHour_v1.0.0.apk`.
            2. Open the file on your Android device.
            3. If prompted, allow "Install from Unknown Sources".
            4. Launch and enjoy the 3D Arena FPS with on-screen touch controls!
          files: ./release-output/CyberArena_ZeroHour_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
